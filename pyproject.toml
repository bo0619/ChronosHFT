[project]
name = "chronoshft"
version = "0.1.0"
description = "Paper-first cryptocurrency market-making runtime"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "cryptography>=45.0.0,<47.0.0",
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "requests>=2.32,<3.0",
    "tables>=3.10,<4.0",
    "websocket-client>=1.8,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9.0",
    "ruff>=0.15.22,<0.16",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
